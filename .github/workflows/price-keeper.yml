name: Token price keeper

# Pulls token prices (LIT, WETH) from CoinGecko and pushes them into:
#   - UpdatableAggregator(s) consumed by AaveOracle (markets, leverage)
#   - MockSwapper          where applicable (testnet leverage swap rates)
#
# Runs every 30 minutes; can also be triggered manually from the Actions tab.
#
# Required secrets (Settings -> Secrets -> Actions):
#   DEPLOYER_PRIVATE_KEY   admin/keeper key — must be each UpdatableAggregator
#                          owner-or-keeper AND MockSwapper admin.
# Optional secrets:
#   COINGECKO_API_KEY      pro key (sent as x-cg-pro-api-key)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Push token prices on-chain
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: npx hardhat run scripts/keeper/updatePrices.js --network baseSepolia
